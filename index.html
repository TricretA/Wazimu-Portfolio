<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020307" />
    <meta name="color-scheme" content="dark" />

    <!--
      This file is the dev-server page and the build template — not the shipped
      home page.

      `scripts/prerender.mjs` takes the built output, rewrites this head per
      route from `src/lib/meta.ts`, and writes all 66 pages with their own
      title, description, canonical, Open Graph block and JSON-LD. Editing meta
      tags here changes what you see in `npm run dev` and nothing a visitor or a
      crawler ever receives — change `src/lib/meta.ts` and `src/lib/schema.ts`
      instead.
    -->
    <title>Tricreta | Real business problems solved</title>
    <meta
      name="description"
      content="Automation engineer and applied AI developer in Kenya. WhatsApp Business API, M-Pesa integrations, n8n workflows and AI agents."
    />
    <meta name="author" content="Reinhard Bonke" />
    <link rel="canonical" href="https://tricreta.co.ke/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Dev only; the build emits this non-blocking from scripts/prerender.mjs. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
